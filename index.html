<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Security -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://static.cloudflareinsights.com https://cdn.onesignal.com https://onesignal.com blob:; worker-src 'self' blob: https://cdn.onesignal.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https: ws: wss: http://localhost:8080 http://127.0.0.1:8080;" />

    <!-- OneSignal Web Push SDK -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({
          appId: "1ed98a30-a4ac-4ba2-a993-b956fe268581",
          allowLocalhostAsSecureOrigin: true,
          notifyButton: {
            enable: false,
          },
        });
      });
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Primary Meta Tags -->
    <title>Transfer Legacy | Secure Crypto Inheritance Vault</title>
    <meta name="title" content="Transfer Legacy" />
    <meta name="description" content="Transfer the access. Protect the legacy. The only platform that securely and automatically transfers your crypto and digital assets to your family." />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://transferlegacy.com/" />
    <meta property="og:title" content="Transfer Legacy | Secure Your Digital Inheritance" />
    <meta property="og:description" content="The world's first AI-guided zero-knowledge legacy transfer protocol." />
    <meta property="og:image" content="https://transferlegacy.com/og-image.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://transferlegacy.com/" />
    <meta property="twitter:title" content="Transfer Legacy | Secure Your Digital Inheritance" />
    <meta property="twitter:description" content="The world's first AI-guided zero-knowledge legacy transfer protocol." />
    <meta property="twitter:image" content="https://transferlegacy.com/og-image.png" />

    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="/favicon.png">

    <!-- Initial Load & Flash of Unstyled Content Prevention -->
    <script>
      (function() {
        try {
          const theme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          if (theme === 'dark') document.documentElement.classList.add('dark');
          else document.documentElement.classList.remove('dark');
        } catch (e) {}
      })();
    </script>
    <style>
      :root {
        --preloader-bg: #F1F5F9;
        --preloader-accent: #4F5CFF;
      }
      .dark {
        --preloader-bg: #020409;
      }
      body {
        margin: 0;
        background-color: var(--preloader-bg);
        font-family: system-ui, -apple-system, sans-serif;
        transition: background-color 0.2s ease;
      }
      .app-preloader {
        position: fixed;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        background: var(--preloader-bg);
        z-index: 9999;
      }
      .app-preloader .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid rgba(79, 92, 255, 0.15);
        border-top-color: var(--preloader-accent);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>

    <!-- Schema.org JSON-LD Markup for SEO -->
    <script type="application/ld+json">
    [
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Transfer Legacy",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "Web",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "description": "Transfer the access. Protect the legacy. Secure digital inheritance vault for cryptocurrency and assets."
      },
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Transfer Legacy",
        "url": "https://transferlegacy.com",
        "logo": "https://transferlegacy.com/logo-dark.png",
        "sameAs": [
          "https://twitter.com/transferlegacy",
          "https://linkedin.com/company/transferlegacy"
        ],
        "contactPoint": {
          "@type": "ContactPoint",
          "email": "support@transferlegacy.global",
          "contactType": "customer service"
        }
      }
    ]
    </script>

  </head>
  <body>
    <div id="root">
      <!-- Loader is instantly unmounted by React upon hydration -->
      <div class="app-preloader">
        <div class="spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
